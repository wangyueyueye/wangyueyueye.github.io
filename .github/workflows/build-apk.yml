name: Build 月之音 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl -fsS "https://wangyueyueye.github.io/manifest.json" >/dev/null \
              && curl -fsS "https://wangyueyueye.github.io/icons/icon-512.png" >/dev/null \
              && curl -fsS "https://wangyueyueye.github.io/.well-known/assetlinks.json" >/dev/null; then
              echo "Pages is live."
              exit 0
            fi
            echo "Waiting for Pages... ($i/90)"
            sleep 4
          done
          echo "Pages did not become live in time." >&2
          exit 1

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BWRAP_SDK="$RUNNER_TEMP/bwrap-sdk"
          mkdir -p "$BWRAP_SDK"
          echo "ANDROID_SDK_ROOT=$BWRAP_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$BWRAP_SDK" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "BWRAP_SDK=$BWRAP_SDK" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$BWRAP_SDK" > "$HOME/.bubblewrap/config.json"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;36.1.0" >/dev/null
          else
            echo "sdkmanager not found" >&2
            exit 1
          fi
          ln -sfn "$SDK_ROOT/cmdline-tools/latest/bin" "$BWRAP_SDK/bin"
          ln -sfn "$SDK_ROOT/build-tools" "$BWRAP_SDK/build-tools"
          ln -sfn "$SDK_ROOT/platforms" "$BWRAP_SDK/platforms"
          ln -sfn "$SDK_ROOT/platform-tools" "$BWRAP_SDK/platform-tools"
          ln -sfn "$SDK_ROOT/licenses" "$BWRAP_SDK/licenses"
          ls -la "$BWRAP_SDK"

      - name: Prepare signing key and TWA project
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/yuezhiyin.keystore
          cp twa-manifest.json android/
          cd android
          bubblewrap update --skipVersionUpgrade --manifest twa-manifest.json

      - name: Build signed APK
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd android
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuezhiyin-apk
          path: android/app-release-signed.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: yuezhiyin-aab
          path: android/app-release-bundle.aab
          if-no-files-found: ignore

